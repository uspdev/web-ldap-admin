services:
  web-ldap-admin:
    build: .
    container_name: web-ldap-admin
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - web-ldap-admin-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: web-ldap-admin_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: web-ldap-admin
      MYSQL_USER: web-ldap-admin
      MYSQL_PASSWORD: web-ldap-admin
      MYSQL_ROOT_PASSWORD: web-ldap-admin
    networks:
      - web-ldap-admin-network

  selenium:
    image: selenium/standalone-chrome
    container_name: web-ldap-admin_selenium
    ports:
      - "7900:7900" # VNC (pra ver o browser rodando)
    networks:
      - web-ldap-admin-network
    shm_size: 2gb

  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: web-ldap-admin_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      web-ldap-admin-network:
        aliases:
          - auth.local

networks:
  web-ldap-admin-network:
